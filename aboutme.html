<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0d0d13">
    <meta name="description" content="Certificates and workshops completed by Kashinath Remeshkumar, with the original PDFs.">
    <title>Achievements - Kashinath Remeshkumar</title>
    <link rel="icon" href="assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
    <link rel="stylesheet" href="site_style.css">
    <script src="site.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="index.html">Kashinath Remeshkumar</a>
            <nav class="nav" aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="experience.html">Experience</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="aboutme.html" aria-current="page">Achievements</a></li>
                    <li><a href="contacts.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main">
        <div class="wrap page-head">
            <h1 class="grad-text">Achievements</h1>
            <p>Certifications and workshops I've completed. Open any certificate to see the original PDF.</p>
        </div>

        <div class="wrap">
            <ul class="cert-grid" id="certificateGrid"></ul>
            <noscript><p class="empty">Turn on JavaScript to see the certificate list.</p></noscript>
        </div>
    </main>

    <dialog id="pdfDialog" aria-labelledby="pdfTitle">
        <div class="dialog-bar">
            <h2 id="pdfTitle"></h2>
            <a class="btn btn-small" id="pdfNewTab" href="#" target="_blank" rel="noopener">Open in new tab</a>
            <button class="dialog-close" id="pdfClose" type="button" aria-label="Close certificate">&times;</button>
        </div>
        <iframe id="pdfFrame" title="Certificate PDF"></iframe>
    </dialog>

    <footer class="site-footer">
        <div class="wrap">
            <p>&copy; 2026 Kashinath Remeshkumar</p>
            <ul>
                <li><a href="https://github.com/kashinathRemeshkumar" target="_blank" rel="noopener">GitHub</a></li>
                <li><a href="https://www.linkedin.com/in/kashi-nath-remeshkumar/" target="_blank" rel="noopener">LinkedIn</a></li>
            </ul>
        </div>
    </footer>

    <script>
        // ============================================
        // CONFIGURE YOUR CERTIFICATES HERE
        // ============================================
        const certificates = [
            {
                filename: "python_basic_certificate.pdf",
                title: "Python (Basic) Certification",
                issuer: "HackerRank",
                date: "December 2025"
            },
            {
                filename: "openleaves.pdf",
                title: "Hands on IoT workshop",
                issuer: "Open Leaves",
                date: "2026"
            },
            {
                filename: "Flutter_Certificate_8.pdf",
                title: "Flutter Certificate", // was blank - replace with the real title
                issuer: "Pace Lab",
                date: "July 2024"
            },
            {
                filename: "nptel.pdf",
                title: "Introduction to Programming in C (Elite)",
                issuer: "NPTEL - IIT Kanpur",
                date: "January - March 2024"
            },
            {
                filename: "iot_workshop.pdf",
                title: "Python Internship",
                issuer: "SRAI Smart Solutions",
                date: "January 2024"
            },
            {
                filename: "ai_python_ms.pdf",
                title: "Python and Artificial Intelligence",
                issuer: "Microsoft Learn Student Ambassador",
                date: "2024"
            },
            {
                filename: "ai_python_google.pdf",
                title: "Python and Artificial Intelligence Bootcamp",
                issuer: "Google Developer Student Clubs",
                date: "2024"
            }
        ];

        // Folder that holds the certificate PDFs
        const certificatesFolder = 'assets/cirtificates/';

        // Card icons, cycled in order
        const icons = ['\u{1F4DC}', '\u{1F3C6}', '\u{1F393}', '\u2B50', '\u{1F3C5}', '\u{1F4DA}', '\u{1F3AF}'];

        const grid = document.getElementById('certificateGrid');
        const dialog = document.getElementById('pdfDialog');
        const frame = document.getElementById('pdfFrame');
        const dialogTitle = document.getElementById('pdfTitle');
        const newTabLink = document.getElementById('pdfNewTab');

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function openCertificate(cert) {
            const url = certificatesFolder + cert.filename;
            // Many phone browsers can't show a PDF inside an iframe, so open it in a tab instead
            if (navigator.pdfViewerEnabled === false) {
                window.open(url, '_blank', 'noopener');
                return;
            }
            dialogTitle.textContent = cert.title;
            newTabLink.href = url;
            frame.src = url;
            dialog.showModal();
        }

        function renderCertificates() {
            if (certificates.length === 0) {
                grid.replaceWith(el('p', 'empty', 'No certificates added yet.'));
                return;
            }

            certificates.forEach(function (cert, index) {
                const url = certificatesFolder + cert.filename;
                const item = el('li', 'reveal');
                const card = el('article', 'cert');

                const preview = el('div', 'cert-preview', icons[index % icons.length]);
                preview.setAttribute('aria-hidden', 'true');

                const body = el('div', 'cert-body');
                const actions = el('div', 'cert-actions');

                const view = el('button', 'btn btn-primary btn-small', 'View');
                view.type = 'button';
                view.setAttribute('aria-label', 'View ' + cert.title);
                view.addEventListener('click', function (event) {
                    event.stopPropagation();
                    openCertificate(cert);
                });

                const download = el('a', 'btn btn-small', 'Download');
                download.href = url;
                download.setAttribute('download', '');
                download.setAttribute('aria-label', 'Download ' + cert.title);
                download.addEventListener('click', function (event) { event.stopPropagation(); });

                actions.append(view, download);
                body.append(
                    el('h2', 'cert-title', cert.title),
                    el('p', 'cert-issuer', cert.issuer),
                    el('p', 'cert-date', cert.date),
                    actions
                );

                card.append(preview, body);
                card.addEventListener('click', function () { openCertificate(cert); });
                item.append(card);
                grid.append(item);
            });
        }

        // Close with the button or by clicking the dimmed backdrop (Esc works natively)
        document.getElementById('pdfClose').addEventListener('click', function () { dialog.close(); });
        dialog.addEventListener('click', function (event) {
            if (event.target === dialog) dialog.close();
        });
        dialog.addEventListener('close', function () { frame.removeAttribute('src'); });

        renderCertificates();
    </script>
</body>
</html>
